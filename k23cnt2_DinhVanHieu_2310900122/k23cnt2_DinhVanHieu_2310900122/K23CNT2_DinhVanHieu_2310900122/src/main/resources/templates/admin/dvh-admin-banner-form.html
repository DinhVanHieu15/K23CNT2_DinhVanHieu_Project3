<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm Banner - DVH Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow-sm mx-auto" style="max-width: 600px;">
        <div class="card-header bg-primary text-white fw-bold">QUẢN LÝ BANNER</div>
        <div class="card-body p-4">
            <form th:action="@{/dvh-admin/banners/save}" th:object="${dvhBanner}" method="post">

                <input type="hidden" th:field="*{dvhId}">

                <div class="mb-3">
                    <label class="form-label fw-bold">Đường dẫn ảnh (Link URL Online):</label>
                    <input type="text" th:field="*{dvhImage}" class="form-control"
                           placeholder="Ví dụ: https://cdn.honda.com.vn/banner.jpg" required>
                    <small class="text-muted">Bạn hãy copy địa chỉ hình ảnh trên mạng và dán vào đây.</small>
                </div>

                <div class="mb-4 form-check">
                    <input type="checkbox" th:field="*{dvhActive}" class="form-check-input" id="activeCheck" checked>
                    <label class="form-check-label fw-bold" for="activeCheck">Hiển thị ngay lập tức</label>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success w-100 fw-bold">Lưu Banner</button>
                    <a th:href="@{/dvh-admin/banners}" class="btn btn-secondary w-100 fw-bold">Hủy</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>

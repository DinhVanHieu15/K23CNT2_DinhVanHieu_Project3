<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Voucher - DVH Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow-sm mx-auto" style="max-width: 600px;">
        <div class="card-header bg-success text-white fw-bold text-center">
            THÔNG TIN VOUCHER
        </div>
        <div class="card-body p-4">
            <form th:action="@{/dvh-admin/vouchers/save}" th:object="${dvhVoucher}" method="post">
                <input type="hidden" th:field="*{dvhId}">

                <div class="mb-3">
                    <label class="form-label fw-bold">Mã giảm giá (Code)</label>
                    <input type="text" th:field="*{dvhCode}" class="form-control" placeholder="VD: SALE2025" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Số tiền giảm (VNĐ)</label>
                        <input type="number" th:field="*{dvhDiscount}" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Số lượng</label>
                        <input type="number" th:field="*{dvhQuantity}" class="form-control" value="100" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Ngày bắt đầu</label>
                        <input type="date" th:field="*{dvhStartDate}" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Ngày kết thúc</label>
                        <input type="date" th:field="*{dvhEndDate}" class="form-control" required>
                    </div>
                </div>

                <div class="d-flex gap-2 mt-3">
                    <button type="submit" class="btn btn-success w-100 fw-bold">Lưu Voucher</button>
                    <a th:href="@{/dvh-admin/vouchers}" class="btn btn-secondary w-100 fw-bold">Hủy</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>

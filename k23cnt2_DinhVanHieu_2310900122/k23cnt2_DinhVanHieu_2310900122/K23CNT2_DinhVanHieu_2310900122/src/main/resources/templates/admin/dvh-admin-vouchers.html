<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Voucher - DVH Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', sans-serif; }
        .dvh-sidebar { height: 100vh; width: 250px; position: fixed; top: 0; left: 0; background: #343a40; color: white; padding-top: 20px; z-index: 1000; }
        .dvh-sidebar a { padding: 15px 25px; text-decoration: none; font-size: 16px; color: #cfd8dc; display: block; transition: 0.3s; }
        .dvh-sidebar a:hover { background: #495057; color: white; }
        .dvh-sidebar .active { background: #cc0000; color: white; }
        .dvh-sidebar i { width: 25px; }
        .dvh-content { margin-left: 250px; padding: 30px; }
    </style>
</head>
<body>

<div class="dvh-sidebar">
    <h3 class="text-center mb-4 fw-bold">DVH ADMIN</h3>
    <a th:href="@{/dvh-admin/dashboard}"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
    <a th:href="@{/dvh-admin/motorbikes}"><i class="fas fa-motorcycle"></i> QL Sản phẩm</a>
    <a th:href="@{/dvh-admin/orders}"><i class="fas fa-shopping-cart"></i> QL Đơn hàng</a>
    <a th:href="@{/dvh-admin/inventory}"><i class="fas fa-warehouse"></i> QL Kho hàng</a>
    <a th:href="@{/dvh-admin/customers}"><i class="fas fa-users"></i> QL Khách hàng</a>
    <a th:href="@{/dvh-admin/employees}"><i class="fas fa-user-tie"></i> QL Nhân viên</a>

    <a th:href="@{/dvh-admin/vouchers}" class="active"><i class="fas fa-ticket-alt"></i> QL Voucher</a>

    <a th:href="@{/dvh-admin/blogs}"><i class="fas fa-newspaper"></i> Tin tức & Blog</a>
    <a th:href="@{/dvh-admin/banners}"><i class="fas fa-images"></i> QL Banner</a>
    <hr style="border-color: #555;">
    <a th:href="@{/}" class="text-success fw-bold"><i class="fas fa-home"></i> Về trang chủ</a>
</div>

<div class="dvh-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">🎫 Quản lý Mã Giảm Giá</h2>
        <a th:href="@{/dvh-admin/vouchers/create}" class="btn btn-success fw-bold"><i class="fas fa-plus"></i> Thêm Voucher</a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Mã Code</th>
                    <th>Giảm giá</th>
                    <th>Số lượng</th>
                    <th>Hạn sử dụng</th>
                    <th>Hành động</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="v : ${dvhVouchers}">
                    <td th:text="${v.dvhId}"></td>
                    <td><span class="badge bg-primary fs-6" th:text="${v.dvhCode}"></span></td>
                    <td class="fw-bold text-danger" th:text="${#numbers.formatDecimal(v.dvhDiscount, 0, 'POINT', 0, 'COMMA')} + ' đ'"></td>

                    <td class="fw-bold" th:text="${v.dvhQuantity}"></td>

                    <td>
                        <span th:if="${v.dvhEndDate != null}" th:text="${v.dvhEndDate}"></span>
                        <span th:if="${v.dvhEndDate == null}" class="text-muted">Vô thời hạn</span>
                    </td>
                    <td>
                        <a th:href="@{/dvh-admin/vouchers/delete/{id}(id=${v.dvhId})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Xóa voucher này?')">
                            <i class="fas fa-trash"></i> Xóa
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>

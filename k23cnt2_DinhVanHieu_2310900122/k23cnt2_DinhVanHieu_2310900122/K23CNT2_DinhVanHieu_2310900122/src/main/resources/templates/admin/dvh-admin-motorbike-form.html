<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Form Sản phẩm - DVH Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5 mb-5">
    <div class="card shadow-sm mx-auto" style="max-width: 900px;">
        <div class="card-header bg-primary text-white fw-bold text-center py-3">
            <span th:if="${dvhMotorbike.dvhId == null}"><i class="fas fa-plus-circle"></i> THÊM XE MỚI</span>
            <span th:if="${dvhMotorbike.dvhId != null}"><i class="fas fa-edit"></i> CẬP NHẬT XE</span>
        </div>

        <div class="card-body p-4">
            <form th:action="@{/dvh-admin/motorbikes/save}" th:object="${dvhMotorbike}" method="post">

                <input type="hidden" th:field="*{dvhId}">

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-bold">Mã xe <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{dvhCode}" class="form-control" placeholder="VD: SP001" required>
                    </div>
                    <div class="col-md-8 mb-3">
                        <label class="form-label fw-bold">Tên xe <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{dvhName}" class="form-control" placeholder="VD: Honda Vario 160" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-bold">Giá bán (VNĐ) <span class="text-danger">*</span></label>
                        <input type="number" th:field="*{dvhPrice}" class="form-control" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-bold">Số lượng tồn kho <span class="text-danger">*</span></label>
                        <input type="number" th:field="*{dvhQuantity}" class="form-control" value="1" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-bold">Năm sản xuất</label>
                        <input type="number" th:field="*{dvhYear}" class="form-control" placeholder="VD: 2024">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-3 mb-3">
                        <label class="form-label fw-bold">Loại xe</label>
                        <select th:field="*{dvhType}" class="form-select">
                            <option value="TAY_GA">Xe Tay Ga</option>
                            <option value="XE_SO">Xe Số</option>
                            <option value="CON_TAY">Xe Côn Tay</option>
                            <option value="MO_TO">Mô Tô PKL</option>
                        </select>
                    </div>

                    <div class="col-md-3 mb-3">
                        <label class="form-label fw-bold">Thương hiệu</label>
                        <select th:field="*{dvhBrand}" class="form-select" required>
                            <option value="">-- Chọn --</option>
                            <option th:each="brand : ${dvhBrandList}"
                                    th:value="${brand}"
                                    th:text="${brand}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-3 mb-3">
                        <label class="form-label fw-bold">Màu sắc</label>
                        <input type="text" th:field="*{dvhColor}" class="form-control" placeholder="VD: Đen nhám">
                    </div>

                    <div class="col-md-3 mb-3">
                        <label class="form-label fw-bold">Tình trạng</label>
                        <select th:field="*{dvhCondition}" class="form-select">
                            <option value="NEW">Xe Mới 100%</option>
                            <option value="USED">Xe Lướt (Cũ)</option>
                        </select>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Link Ảnh (URL) <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{dvhImage}" class="form-control"
                           placeholder="Dán link ảnh vào đây (VD: https://i.imgur.com/abc.jpg)" required>

                    <div class="mt-3 p-2 border rounded bg-white text-center"
                         th:if="${dvhMotorbike.dvhImage != null && dvhMotorbike.dvhImage != ''}">
                        <span class="d-block small text-muted mb-1">Ảnh xem trước:</span>
                        <img th:src="${dvhMotorbike.dvhImage}" height="150" class="rounded shadow-sm"
                             onerror="this.src='https://via.placeholder.com/150?text=Loi+Anh'">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Mô tả chi tiết</label>
                    <textarea th:field="*{dvhDescription}" class="form-control" rows="5" placeholder="Nhập mô tả sản phẩm..."></textarea>
                </div>

                <div class="d-flex justify-content-end gap-2 border-top pt-3">
                    <a th:href="@{/dvh-admin/motorbikes}" class="btn btn-secondary px-4 fw-bold">
                        <i class="fas fa-arrow-left"></i> Quay lại
                    </a>
                    <button type="submit" class="btn btn-primary px-4 fw-bold">
                        <i class="fas fa-save"></i> Lưu Sản Phẩm
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

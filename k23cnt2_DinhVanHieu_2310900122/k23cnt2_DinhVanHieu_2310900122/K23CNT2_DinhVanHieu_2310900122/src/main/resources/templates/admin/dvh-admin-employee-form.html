<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thông tin Nhân viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow-sm mx-auto" style="max-width: 600px;">
        <div class="card-header bg-primary text-white fw-bold">
            <span th:if="${dvhUser.dvhId == null}">THÊM NHÂN VIÊN MỚI</span>
            <span th:if="${dvhUser.dvhId != null}">CẬP NHẬT NHÂN VIÊN</span>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/dvh-admin/employees/save}" th:object="${dvhUser}" method="post">
                <input type="hidden" th:field="*{dvhId}">

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Tên đăng nhập (*)</label>
                        <input type="text" th:field="*{dvhUsername}" class="form-control" required
                               th:readonly="${dvhUser.dvhId != null}"> </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Mật khẩu (*)</label>
                        <input type="text" th:field="*{dvhPassword}" class="form-control" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Họ và tên đầy đủ</label>
                    <input type="text" th:field="*{dvhFullName}" class="form-control" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Email</label>
                        <input type="email" th:field="*{dvhEmail}" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Số điện thoại</label>
                        <input type="text" th:field="*{dvhPhone}" class="form-control" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Chức vụ / Quyền hạn</label>
                    <select th:field="*{dvhRole}" class="form-select border-primary fw-bold">
                        <option value="STAFF">Nhân viên (Staff)</option>
                        <option value="ADMIN">Quản trị viên (Admin)</option>
                    </select>
                    <small class="text-muted">Lưu ý: Admin có toàn quyền quản lý hệ thống.</small>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success w-100 fw-bold">Lưu Thông Tin</button>
                    <a th:href="@{/dvh-admin/employees}" class="btn btn-secondary w-100 fw-bold">Hủy</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>

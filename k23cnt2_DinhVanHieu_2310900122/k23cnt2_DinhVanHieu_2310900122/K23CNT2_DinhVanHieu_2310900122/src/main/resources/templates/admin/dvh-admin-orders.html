<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Đơn hàng - DVH Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', sans-serif; }
        .dvh-sidebar { height: 100vh; width: 250px; position: fixed; top: 0; left: 0; background: #343a40; color: white; padding-top: 20px; z-index: 1000; }
        .dvh-sidebar a { padding: 15px 25px; text-decoration: none; font-size: 16px; color: #cfd8dc; display: block; transition: 0.3s; }
        .dvh-sidebar a:hover { background: #495057; color: white; }
        .dvh-sidebar .active { background: #cc0000; color: white; }
        .dvh-sidebar i { width: 25px; }
        .dvh-content { margin-left: 250px; padding: 30px; }
    </style>
</head>
<body>

<div class="dvh-sidebar">
    <h3 class="text-center mb-4 fw-bold">DVH ADMIN</h3>
    <a th:href="@{/dvh-admin/dashboard}"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
    <a th:href="@{/dvh-admin/motorbikes}"><i class="fas fa-motorcycle"></i> QL Sản phẩm</a>
    <a th:href="@{/dvh-admin/orders}" class="active"><i class="fas fa-shopping-cart"></i> QL Đơn hàng</a>
    <a th:href="@{/dvh-admin/inventory}"><i class="fas fa-warehouse"></i> QL Kho hàng</a>
    <a th:href="@{/dvh-admin/customers}"><i class="fas fa-users"></i> QL Khách hàng</a>
    <a th:href="@{/dvh-admin/employees}"><i class="fas fa-user-tie"></i> QL Nhân viên</a>
    <a th:href="@{/dvh-admin/vouchers}"><i class="fas fa-ticket-alt"></i> QL Voucher</a>
    <a th:href="@{/dvh-admin/blogs}"><i class="fas fa-newspaper"></i> Tin tức & Blog</a>
    <a th:href="@{/dvh-admin/banners}"><i class="fas fa-images"></i> QL Banner</a>
    <hr style="border-color: #555;">
    <a th:href="@{/}" class="text-success fw-bold"><i class="fas fa-home"></i> Về trang chủ</a>
</div>

<div class="dvh-content">
    <h2 class="fw-bold mb-4">📦 Quản lý Đơn Hàng</h2>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>Mã đơn</th>
                    <th>Khách hàng</th>
                    <th>Ngày đặt</th>
                    <th>Tổng tiền</th>
                    <th>Trạng thái</th>
                    <th>Hành động</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="order : ${dvhOrders}">
                    <td class="fw-bold text-primary" th:text="${order.dvhCode}"></td>

                    <td>
                        <div class="fw-bold" th:text="${order.dvhReceiverName}"></div>
                        <small class="text-muted" th:text="${order.dvhReceiverPhone}"></small>
                    </td>

                    <td th:text="${order.dvhOrderDate}"></td>

                    <td class="text-danger fw-bold"
                        th:text="${order.dvhTotalAmount != null ? #numbers.formatDecimal(order.dvhTotalAmount, 0, 'POINT', 0, 'COMMA') + ' đ' : '0 đ'}">
                    </td>

                    <td>
                        <span th:if="${order.dvhStatus == 'CHO_XAC_NHAN'}" class="badge bg-warning text-dark">Chờ xác nhận</span>
                        <span th:if="${order.dvhStatus == 'DANG_GIAO'}" class="badge bg-primary">Đang giao</span>
                        <span th:if="${order.dvhStatus == 'DA_GIAO'}" class="badge bg-success">Đã giao</span>
                        <span th:if="${order.dvhStatus == 'HUY'}" class="badge bg-danger">Đã hủy</span>

                        <span th:if="${order.dvhStatus != 'CHO_XAC_NHAN' && order.dvhStatus != 'DANG_GIAO' && order.dvhStatus != 'DA_GIAO' && order.dvhStatus != 'HUY'}"
                              class="badge bg-secondary" th:text="${order.dvhStatus}"></span>
                    </td>

                    <td>
                        <form th:action="@{/dvh-admin/orders/update-status}" method="post" class="d-flex gap-1">
                            <input type="hidden" name="id" th:value="${order.dvhId}">
                            <select name="status" class="form-select form-select-sm" style="width: 130px;" onchange="this.form.submit()">
                                <option value="CHO_XAC_NHAN" th:selected="${order.dvhStatus == 'CHO_XAC_NHAN'}">Chờ xác nhận</option>
                                <option value="DANG_GIAO" th:selected="${order.dvhStatus == 'DANG_GIAO'}">Đang giao</option>
                                <option value="DA_GIAO" th:selected="${order.dvhStatus == 'DA_GIAO'}">Đã giao</option>
                                <option value="HUY" th:selected="${order.dvhStatus == 'HUY'}">Hủy đơn</option>
                            </select>
                        </form>
                    </td>
                </tr>

                <tr th:if="${dvhOrders == null || dvhOrders.empty}">
                    <td colspan="6" class="text-center py-4 text-muted">Chưa có đơn hàng nào</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${dvhBlogPost.dvhTitle} + ' - DVH Blog'">Chi tiết bài viết</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        .dvh-header { background: #fff !important; }
        body { background-color: #f9f9f9; font-family: 'Segoe UI', sans-serif; }

        .blog-content-wrapper {
            background: white; padding: 40px; border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-top: 30px;
        }
        .blog-title { font-weight: 800; color: #333; margin-bottom: 15px; }
        .blog-meta { color: #888; font-size: 0.9rem; margin-bottom: 25px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .blog-main-image {
            width: 100%; max-height: 500px; object-fit: cover;
            border-radius: 8px; margin-bottom: 30px;
        }
        .blog-text { font-size: 1.1rem; line-height: 1.8; color: #444; text-align: justify; }

        .related-title { font-weight: bold; margin-top: 50px; margin-bottom: 20px; border-left: 5px solid #cc0000; padding-left: 10px; }
    </style>
</head>
<body>

<div th:replace="~{layout/dvh-header :: header-section}"></div>

<div class="container mb-5">
    <nav aria-label="breadcrumb" class="mt-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/" class="text-decoration-none text-muted">Trang chủ</a></li>
            <li class="breadcrumb-item"><a href="/dvh-blogs" class="text-decoration-none text-muted">Tin tức</a></li>
            <li class="breadcrumb-item active fw-bold" aria-current="page" th:text="${dvhBlogPost.dvhTitle}"></li>
        </ol>
    </nav>

    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="blog-content-wrapper">
                <h1 class="blog-title" th:text="${dvhBlogPost.dvhTitle}">Tiêu đề bài viết</h1>

                <div class="blog-meta">
                    <i class="far fa-calendar-alt me-2"></i>
                    <span th:text="${#temporals.format(dvhBlogPost.dvhCreatedAt, 'dd-MM-yyyy HH:mm')}">12/12/2025</span>
                    <span class="mx-2">|</span>
                    <i class="far fa-user me-2"></i> Admin
                </div>

                <img th:src="${dvhBlogPost.dvhImage != null && dvhBlogPost.dvhImage.startsWith('http') ? dvhBlogPost.dvhImage : '/img/' + dvhBlogPost.dvhImage}"
                     class="blog-main-image shadow-sm"
                     alt="Ảnh bài viết"
                     onerror="this.src='https://via.placeholder.com/800x400?text=No+Image'">

                <div class="blog-text">
                    <p th:text="${dvhBlogPost.dvhContent}"></p>
                </div>

                <div class="mt-5 text-center">
                    <a th:href="@{/dvh-blogs}" class="btn btn-outline-secondary px-4 rounded-pill">
                        <i class="fas fa-arrow-left me-2"></i> Quay lại danh sách tin tức
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout/dvh-footer :: footer-section}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

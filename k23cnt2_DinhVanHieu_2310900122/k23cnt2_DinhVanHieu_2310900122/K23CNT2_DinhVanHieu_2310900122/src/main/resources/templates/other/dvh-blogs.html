<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tin tức Xe máy - DVH Motorbike</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        /* CSS Fix lỗi Header bị trong suốt/mất màu */
        .dvh-header { background: #fff !important; }

        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }

        /* CSS cho thẻ Card Tin tức */
        .blog-card {
            border: none; border-radius: 10px; overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: 0.3s; height: 100%; background: #fff;
            display: flex; flex-direction: column; /* Để footer card luôn ở đáy */
        }
        .blog-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .blog-img { height: 220px; object-fit: cover; width: 100%; transition: 0.3s; }
        .blog-card:hover .blog-img { transform: scale(1.05); }
        .blog-body { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
        .blog-meta { font-size: 13px; color: #888; margin-bottom: 10px; display: flex; align-items: center; gap: 5px; }
        .blog-title {
            font-weight: 700; font-size: 18px; margin-bottom: 10px; display: block;
            height: 54px; overflow: hidden; line-height: 1.4; color: #333; text-decoration: none;
        }
        .blog-title:hover { color: #cc0000; }
        .blog-desc { font-size: 14px; color: #666; height: 60px; overflow: hidden; margin-bottom: 15px; }
        .btn-read { color: #cc0000; font-weight: 600; font-size: 14px; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; margin-top: auto; }
        .btn-read:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div th:replace="~{layout/dvh-header :: header-section}"></div>

<div class="container py-5">
    <div class="text-center mb-5">
        <h2 class="fw-bold" style="color: #cc0000; text-transform: uppercase;">Tin Tức & Sự Kiện</h2>
        <p class="text-muted">Cập nhật những xu hướng xe máy mới nhất năm 2025</p>
    </div>

    <div class="row g-4">
        <div class="col-md-4" th:each="blog : ${dvhBlogs}">
            <div class="blog-card">
                <div style="overflow: hidden;">
                    <img th:src="${blog.dvhImage != null && blog.dvhImage.startsWith('http') ? blog.dvhImage : '/img/' + blog.dvhImage}"
                         class="blog-img"
                         alt="Ảnh tin tức"
                         onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'">
                </div>
                <div class="blog-body">
                    <div class="blog-meta">
                        <i class="far fa-calendar-alt"></i>
                        <span th:text="${#temporals.format(blog.dvhCreatedAt, 'dd-MM-yyyy')}"></span>
                    </div>

                    <a th:href="@{/dvh-blogs/detail/{id}(id=${blog.dvhId})}" class="blog-title" th:text="${blog.dvhTitle}">Tiêu đề bài viết</a>

                    <p class="blog-desc" th:text="${blog.dvhContent}">Nội dung tóm tắt...</p>

                    <a th:href="@{/dvh-blogs/detail/{id}(id=${blog.dvhId})}" class="btn-read">
                        Đọc tiếp <i class="fas fa-arrow-right"></i>
                    </a>
                </div>
            </div>
        </div>

        <div th:if="${dvhBlogs.empty}" class="text-center py-5 col-12">
            <i class="far fa-newspaper fa-3x text-muted mb-3"></i>
            <h5 class="text-muted">Chưa có bài viết nào được đăng.</h5>
        </div>
    </div>
</div>

<div th:replace="~{layout/dvh-footer :: footer-section}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

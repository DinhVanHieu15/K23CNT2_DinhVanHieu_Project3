<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký - DVH Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #fdf2f2; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; }
        .dvh-auth-container { width: 900px; max-width: 95%; background: #fff; border-radius: 30px; box-shadow: 0 15px 35px rgba(204, 0, 0, 0.15); overflow: hidden; display: flex; min-height: 600px; }
        .dvh-auth-img { flex: 1; background: #333; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; padding: 40px; position: relative; text-align: center; }
        .dvh-helmet-icon { font-size: 80px; margin-bottom: 20px; color: #f1c40f; }
        .dvh-auth-form { flex: 1; padding: 40px 50px; display: flex; flex-direction: column; justify-content: center; }
        .dvh-title { font-size: 28px; font-weight: 800; color: #cc0000; margin-bottom: 5px; }
        .dvh-input-group { position: relative; margin-bottom: 15px; }
        .dvh-input { width: 100%; padding: 12px 20px 12px 50px; border: 2px solid #eee; border-radius: 50px; outline: none; transition: 0.3s; background: #f9f9f9; }
        .dvh-input:focus { border-color: #cc0000; background: #fff; }
        .dvh-icon-input { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: #cc0000; font-size: 16px; }
        .dvh-btn-submit { background: #cc0000; color: white; border: none; width: 100%; padding: 12px; border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .dvh-btn-submit:hover { background: #a00000; transform: scale(1.02); }
        .dvh-link { text-align: center; margin-top: 15px; font-size: 14px; }
        .dvh-link a { color: #cc0000; font-weight: 600; text-decoration: none; }
        @media (max-width: 768px) { .dvh-auth-container { flex-direction: column-reverse; height: auto; margin: 20px 0;} }
    </style>
</head>
<body>

<div class="dvh-auth-container">
    <div class="dvh-auth-form">
        <div class="dvh-title">Đăng Ký Mới 🛡️</div>
        <p style="color: #666; font-size: 14px; margin-bottom: 20px;">Gia nhập cộng đồng Biker DVH ngay hôm nay!</p>

        <form th:action="@{/dvh-login/dvh-register}" method="post" th:object="${dvhRegisterRequest}">

            <div class="dvh-input-group">
                <i class="fas fa-id-card dvh-icon-input"></i>
                <input type="text" class="dvh-input" th:field="*{dvhFullName}" placeholder="Họ và tên của bạn" required>
            </div>

            <div class="dvh-input-group">
                <i class="fas fa-envelope dvh-icon-input"></i>
                <input type="email" class="dvh-input" th:field="*{dvhEmail}" placeholder="Email liên hệ" required>
            </div>

            <div class="dvh-input-group">
                <i class="fas fa-phone dvh-icon-input"></i>
                <input type="text" class="dvh-input" th:field="*{dvhPhone}" placeholder="Số điện thoại" required>
            </div>

            <div class="dvh-input-group">
                <i class="fas fa-user-circle dvh-icon-input"></i>
                <input type="text" class="dvh-input" th:field="*{dvhUsername}" placeholder="Tên đăng nhập mong muốn" required>
            </div>

            <div class="dvh-input-group">
                <i class="fas fa-lock dvh-icon-input"></i>
                <input type="password" class="dvh-input" th:field="*{dvhPassword}" placeholder="Mật khẩu" required>
            </div>

            <button type="submit" class="dvh-btn-submit">
                Hoàn Tất & Lên Xe <i class="fas fa-check-circle" style="margin-left:5px;"></i>
            </button>
        </form>

        <div class="dvh-link">
            Đã có tài khoản rồi? <br>
            <a th:href="@{/dvh-login/dvh-login}">Quay lại gara (Đăng nhập)</a>
        </div>
    </div>

    <div class="dvh-auth-img">
        <i class="fas fa-helmet-safety dvh-helmet-icon"></i>
        <h3>An Toàn Là Bạn</h3>
        <p style="opacity: 0.8;">Đăng ký thành viên để nhận ưu đãi.</p>
    </div>
</div>

</body>
</html>

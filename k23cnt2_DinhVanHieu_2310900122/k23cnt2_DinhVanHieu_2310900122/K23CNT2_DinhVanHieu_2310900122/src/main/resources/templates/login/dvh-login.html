<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - DVH Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* CSS giữ nguyên như cũ */
        body { background: #fdf2f2; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; }
        .dvh-auth-container { width: 900px; max-width: 95%; background: #fff; border-radius: 30px; box-shadow: 0 15px 35px rgba(204, 0, 0, 0.15); overflow: hidden; display: flex; min-height: 550px; }
        .dvh-auth-img { flex: 1; background: #cc0000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; padding: 40px; position: relative; text-align: center; }
        .dvh-bike-icon { font-size: 100px; margin-bottom: 20px; animation: vroom 0.5s infinite alternate; }
        @keyframes vroom { from { transform: translateY(0); } to { transform: translateY(-5px); } }
        .dvh-auth-form { flex: 1; padding: 50px; display: flex; flex-direction: column; justify-content: center; }
        .dvh-title { font-size: 28px; font-weight: 800; color: #cc0000; margin-bottom: 10px; }
        .dvh-subtitle { font-size: 14px; color: #888; margin-bottom: 30px; }
        .dvh-input-group { position: relative; margin-bottom: 20px; }
        .dvh-input { width: 100%; padding: 15px 20px 15px 50px; border: 2px solid #eee; border-radius: 50px; font-size: 15px; outline: none; transition: 0.3s; background: #f9f9f9; }
        .dvh-input:focus { border-color: #cc0000; background: #fff; }
        .dvh-icon-input { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: #cc0000; font-size: 18px; }
        .dvh-btn-submit { background: #cc0000; color: white; border: none; width: 100%; padding: 15px; border-radius: 50px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .dvh-btn-submit:hover { background: #a00000; transform: scale(1.02); }
        .dvh-link { text-align: center; margin-top: 20px; font-size: 14px; }
        .dvh-link a { color: #cc0000; font-weight: 600; text-decoration: none; }
        @media (max-width: 768px) { .dvh-auth-container { flex-direction: column; height: auto; } }
    </style>
</head>
<body>

<div class="dvh-auth-container">
    <div class="dvh-auth-img">
        <i class="fas fa-motorcycle dvh-bike-icon"></i>
        <h2>Chào Bạn! 👋</h2>
        <p>Sẵn sàng cho chuyến đi mới cùng DVH Shop chưa?</p>
    </div>

    <div class="dvh-auth-form">
        <div class="dvh-title">Đăng Nhập 🛵</div>
        <div class="dvh-subtitle">Nhập thông tin để vào gara của bạn</div>

        <div th:if="${dvhError}" style="color: red; text-align: center; margin-bottom: 15px; font-weight: bold;">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${dvhError}"></span>
        </div>

        <form th:action="@{/dvh-login/dvh-login}" method="post">

            <div class="dvh-input-group">
                <i class="fas fa-user dvh-icon-input"></i>
                <input type="text" class="dvh-input" name="dvhUsername" placeholder="Tên tài khoản / Email" required>
            </div>

            <div class="dvh-input-group">
                <i class="fas fa-key dvh-icon-input"></i>
                <input type="password" class="dvh-input" name="dvhPassword" placeholder="Mật khẩu bí mật" required>
            </div>

            <button type="submit" class="dvh-btn-submit">
                Nổ Máy (Đăng Nhập) <i class="fas fa-arrow-right"></i>
            </button>
        </form>

        <div class="dvh-link">
            Chưa có xe (tài khoản)? <br>
            <a th:href="@{/dvh-login/dvh-register}">Đăng ký biển số mới ngay!</a>
        </div>
        <div class="dvh-link">
            <a th:href="@{/}">← Quay về Trang chủ</a>
        </div>
    </div>
</div>

</body>
</html>

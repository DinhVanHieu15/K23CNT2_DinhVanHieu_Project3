<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Hồ sơ của tôi - DVH Motorbike</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">

    <style>
        :root { --primary-color: #cc0000; --bg-light: #f5f5f5; }
        body { background-color: var(--bg-light); font-family: 'Roboto', sans-serif; }
        a { text-decoration: none; color: inherit; }

        /* --- CSS CHO HEADER --- */
        .dvh-header { background: #fff !important; } /* Fix lỗi header bị đè màu */

        /* --- CSS CHO SIDEBAR --- */
        .dvh-sidebar-profile { background: white; border-radius: 8px; padding: 20px 0; box-shadow: 0 1px 2px rgba(0,0,0,0.1); overflow: hidden; }
        .dvh-user-card { display: flex; align-items: center; padding: 0 20px 20px; border-bottom: 1px solid #eee; margin-bottom: 10px; }
        .dvh-avatar-circle {
            width: 50px; height: 50px; background: #eee; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: #888; font-size: 24px; border: 3px solid #f9f9f9;
        }
        .dvh-user-info { margin-left: 15px; }
        .dvh-user-name { font-weight: 700; color: #333; margin: 0; font-size: 15px; }
        .dvh-edit-link { font-size: 13px; color: #888; display: flex; align-items: center; gap: 5px; cursor: pointer; }

        .dvh-menu-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 25px;
            color: #555; font-weight: 500; transition: 0.2s; font-size: 15px;
        }
        .dvh-menu-item:hover { color: var(--primary-color); background: #fdf2f2; }
        .dvh-menu-item.active { color: var(--primary-color); font-weight: 700; border-right: 4px solid var(--primary-color); background: #fffbfb; }
        .dvh-menu-icon { width: 22px; text-align: center; }

        /* --- CSS FORM PROFILE --- */
        .dvh-main-profile { background: white; border-radius: 8px; padding: 40px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); min-height: 550px; }
        .dvh-header-profile { border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 30px; }
        .dvh-header-title { font-size: 20px; font-weight: 600; color: #333; margin: 0; }
        .dvh-header-desc { font-size: 14px; color: #666; margin-top: 5px; }

        .form-label { color: #555; font-weight: 500; font-size: 15px; margin-bottom: 0; }
        .form-control { font-size: 15px; padding: 12px 15px; border-radius: 6px; }
        .dvh-input-readonly { background-color: #f8f9fa; color: #6c757d; cursor: not-allowed; }

        .btn-save {
            background: var(--primary-color); color: white; padding: 12px 50px;
            border: none; border-radius: 6px; font-weight: 600; transition: 0.3s;
            box-shadow: 0 4px 6px rgba(204, 0, 0, 0.2); font-size: 16px;
        }
        .btn-save:hover { background: #b30000; transform: translateY(-2px); }
    </style>
</head>
<body>

<div th:replace="~{layout/dvh-header :: header-section}"></div>

<div class="container py-4">
    <div class="row g-4">

        <div class="col-md-3">
            <div class="dvh-sidebar-profile">
                <div class="dvh-user-card">
                    <div class="dvh-avatar-circle">
                        <span th:text="${session.dvhCurrentUser != null ? #strings.substring(session.dvhCurrentUser.dvhFullName,0,1) : 'U'}">U</span>
                    </div>
                    <div class="dvh-user-info">
                        <p class="dvh-user-name" th:text="${session.dvhCurrentUser.dvhUsername}">User</p>
                        <span class="dvh-edit-link"><i class="fas fa-pen"></i> Sửa hồ sơ</span>
                    </div>
                </div>

                <a th:href="@{/dvh-profile}" class="dvh-menu-item active">
                    <i class="fas fa-user dvh-menu-icon"></i> Hồ sơ của tôi
                </a>
                <a th:href="@{/dvh-orders}" class="dvh-menu-item">
                    <i class="fas fa-clipboard-list dvh-menu-icon" style="color: #2980b9;"></i> Đơn mua
                </a>

                <a th:if="${session.dvhCurrentUser.dvhRole == 'ADMIN' or session.dvhCurrentUser.dvhRole == 'ROLE_ADMIN'}"
                   th:href="@{/dvh-admin/dashboard}" class="dvh-menu-item" style="color: #d35400;">
                    <i class="fas fa-tachometer-alt dvh-menu-icon"></i> Quản trị Web
                </a>

                <hr style="margin: 10px 20px; border-color: #eee;">
                <a th:href="@{/dvh-login/dvh-logout}" class="dvh-menu-item" style="color: #e74c3c;">
                    <i class="fas fa-sign-out-alt dvh-menu-icon"></i> Đăng xuất
                </a>
            </div>
        </div>

        <div class="col-md-9">
            <div class="dvh-main-profile">
                <div class="dvh-header-profile">
                    <h4 class="dvh-header-title">Hồ Sơ Của Tôi</h4>
                    <p class="dvh-header-desc">Quản lý thông tin hồ sơ để bảo mật tài khoản</p>
                </div>

                <div th:if="${dvhMessage}" class="alert alert-success alert-dismissible fade show mb-4" role="alert">
                    <i class="fas fa-check-circle me-2"></i>
                    <span th:text="${dvhMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <form th:action="@{/dvh-account/update-profile}" method="post">
                    <div class="row justify-content-center">
                        <div class="col-md-10">

                            <div class="mb-4 row align-items-center">
                                <label class="col-sm-3 text-end form-label">Tên đăng nhập</label>
                                <div class="col-sm-9">
                                    <input type="text" class="form-control dvh-input-readonly"
                                           th:value="${session.dvhCurrentUser.dvhUsername}" readonly>
                                </div>
                            </div>

                            <div class="mb-4 row align-items-center">
                                <label class="col-sm-3 text-end form-label">Họ và tên</label>
                                <div class="col-sm-9">
                                    <input type="text" class="form-control"
                                           name="dvhFullName"
                                           th:value="${session.dvhCurrentUser.dvhFullName}">
                                </div>
                            </div>

                            <div class="mb-4 row align-items-center">
                                <label class="col-sm-3 text-end form-label">Email</label>
                                <div class="col-sm-9">
                                    <input type="text" class="form-control"
                                           name="dvhEmail"
                                           th:value="${session.dvhCurrentUser.dvhEmail}">
                                </div>
                            </div>

                            <div class="mb-4 row align-items-center">
                                <label class="col-sm-3 text-end form-label">Số điện thoại</label>
                                <div class="col-sm-9">
                                    <input type="text" class="form-control"
                                           name="dvhPhone"
                                           th:value="${session.dvhCurrentUser.dvhPhone}">
                                </div>
                            </div>

                            <div class="row mt-5">
                                <div class="col-sm-3"></div>
                                <div class="col-sm-9">
                                    <button type="submit" class="btn-save">Lưu Thay Đổi</button>
                                </div>
                            </div>

                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

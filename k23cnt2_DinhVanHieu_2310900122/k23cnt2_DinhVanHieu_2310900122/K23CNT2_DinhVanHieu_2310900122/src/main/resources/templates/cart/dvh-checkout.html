<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thanh toán - DVH Motorbike</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        .dvh-header { background: #fff !important; }

        /* Style cho ô chọn thanh toán */
        .payment-option {
            border: 1px solid #e9ecef;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 10px;
            background: #fff;
        }

        /* Hiệu ứng khi di chuột hoặc được chọn */
        .payment-option:hover, .payment-option.active {
            border-color: #cc0000;
            background-color: #fff5f5;
            box-shadow: 0 2px 8px rgba(204, 0, 0, 0.1);
        }

        /* Khung QR Code */
        .qr-box {
            display: none; /* Mặc định ẩn */
            text-align: center;
            margin-top: 15px;
            padding: 20px;
            background: #fff;
            border: 2px dashed #cc0000;
            border-radius: 8px;
        }
        .qr-img {
            max-width: 100%;
            height: auto;
            border-radius: 5px;
        }
    </style>
</head>
<body class="bg-light">

<div th:replace="~{layout/dvh-header :: header-section}"></div>

<div class="container py-5">
    <h2 class="text-center fw-bold mb-4 text-uppercase" style="color: #cc0000;">Xác nhận thanh toán</h2>

    <form action="/dvh-checkout/place-order" method="post">
        <div class="row g-4">

            <div class="col-lg-7">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white fw-bold py-3">
                        <i class="fas fa-map-marker-alt me-2 text-danger"></i> THÔNG TIN GIAO HÀNG
                    </div>
                    <div class="card-body p-4">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Họ và tên</label>
                            <input type="text" name="name" class="form-control py-2" required
                                   th:value="${dvhUser?.dvhFullName}" placeholder="VD: Nguyễn Văn A">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Số điện thoại</label>
                            <input type="text" name="phone" class="form-control py-2" required
                                   th:value="${dvhUser?.dvhPhone}" placeholder="VD: 0988xxxxxx">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Địa chỉ nhận hàng</label>
                            <textarea name="address" class="form-control" rows="3" required
                                      th:text="${dvhUser?.dvhAddress}" placeholder="Số nhà, đường, phường/xã..."></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-5">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-header bg-white fw-bold py-3">
                        <i class="fas fa-shopping-bag me-2 text-danger"></i> ĐƠN HÀNG CỦA BẠN
                    </div>
                    <div class="card-body p-4">

                        <ul class="list-group list-group-flush mb-4">
                            <li class="list-group-item d-flex justify-content-between align-items-center px-0"
                                th:each="item : ${dvhCart}">
                                <div class="d-flex align-items-center">
                                    <span class="badge bg-secondary rounded-pill me-2" th:text="${item.dvhQuantity}">1</span>
                                    <div>
                                        <h6 class="my-0" th:text="${item.dvhName}">Tên xe</h6>
                                    </div>
                                </div>
                                <span class="text-muted fw-bold"
                                      th:text="${item.dvhTotalPrice != null ? #numbers.formatDecimal(item.dvhTotalPrice, 0, 'POINT', 0, 'COMMA') + ' đ' : '0 đ'}">
                                    </span>
                            </li>

                            <li class="list-group-item d-flex justify-content-between px-0 bg-light mt-2 py-3">
                                <span class="fw-bold fs-5">TỔNG CỘNG:</span>
                                <strong class="text-danger fs-4">
                                    <span th:if="${dvhTotal != null}" th:text="${#numbers.formatDecimal(dvhTotal, 0, 'POINT', 0, 'COMMA')} + ' đ'"></span>
                                    <span th:if="${dvhTotal == null}">0 đ</span>
                                </strong>
                            </li>
                        </ul>

                        <hr>

                        <h6 class="fw-bold mb-3">Chọn phương thức thanh toán:</h6>

                        <label class="payment-option d-flex align-items-center w-100 active" onclick="selectPayment(this, 'cash')">
                            <input type="radio" name="paymentMethod" value="CASH" checked class="me-3 form-check-input">
                            <div>
                                <h6 class="mb-0 fw-bold"><i class="fas fa-money-bill-wave text-success me-2"></i>Tiền mặt (COD)</h6>
                                <small class="text-muted">Thanh toán khi nhận xe</small>
                            </div>
                        </label>

                        <label class="payment-option d-flex align-items-center w-100" onclick="selectPayment(this, 'qr')">
                            <input type="radio" name="paymentMethod" value="TRANSFER" class="me-3 form-check-input">
                            <div>
                                <h6 class="mb-0 fw-bold"><i class="fas fa-qrcode text-primary me-2"></i>Chuyển khoản QR</h6>
                                <small class="text-muted">Quét mã VietQR / ZaloPay</small>
                            </div>
                        </label>

                        <div id="qrSection" class="qr-box">
                            <h6 class="fw-bold text-danger">QUÉT MÃ ĐỂ THANH TOÁN</h6>
                            <img th:src="@{/img/my-qr.jpg}" class="qr-img mb-2" alt="QR Code" style="width: 200px;"
                                 onerror="this.src='https://via.placeholder.com/200?text=QR+Code'">
                            <div class="alert alert-warning small mb-0">
                                Nội dung: <strong>Tên + SĐT mua hàng</strong>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-danger w-100 py-3 mt-4 fw-bold fs-5 text-uppercase shadow">
                            <i class="fas fa-check-circle me-2"></i> Xác nhận đặt hàng
                        </button>

                        <div class="text-center mt-3">
                            <a href="/dvh-cart" class="text-decoration-none text-muted"><i class="fas fa-arrow-left"></i> Quay lại giỏ hàng</a>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

<script>
    function selectPayment(element, type) {
        // 1. Xóa class active ở tất cả các ô
        document.querySelectorAll('.payment-option').forEach(el => el.classList.remove('active'));

        // 2. Thêm class active cho ô được chọn
        element.classList.add('active');

        // 3. Chọn radio button bên trong (để chắc chắn form gửi đúng value)
        const radio = element.querySelector('input[type="radio"]');
        if(radio) radio.checked = true;

        // 4. Ẩn/Hiện khung QR
        const qrBox = document.getElementById('qrSection');
        if (type === 'qr') {
            qrBox.style.display = 'block';
        } else {
            qrBox.style.display = 'none';
        }
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

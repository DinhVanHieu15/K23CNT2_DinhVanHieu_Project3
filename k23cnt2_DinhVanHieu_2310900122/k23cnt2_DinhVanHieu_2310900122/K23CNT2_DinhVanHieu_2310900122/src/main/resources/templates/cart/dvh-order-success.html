<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đặt hàng thành công</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{layout/dvh-header :: header-section}"></div>

<div class="container text-center py-5">
    <div class="card shadow-sm border-0 mx-auto" style="max-width: 600px;">
        <div class="card-body p-5">
            <div class="mb-4">
                <i class="fas fa-check-circle text-success" style="font-size: 80px;"></i>
            </div>
            <h2 class="fw-bold text-success mb-3">ĐẶT HÀNG THÀNH CÔNG!</h2>
            <p class="text-muted fs-5 mb-4">Cảm ơn bạn đã tin tưởng và ủng hộ DVH Motorbike.</p>
            <p class="mb-4">Đơn hàng của bạn đang được xử lý. Chúng tôi sẽ liên hệ sớm nhất để giao hàng.</p>

            <div class="d-grid gap-2 d-sm-block">
                <a href="/dvh-products" class="btn btn-outline-dark px-4 py-2 me-2 fw-bold">
                    <i class="fas fa-arrow-left me-2"></i> TIẾP TỤC MUA
                </a>
                <a href="/dvh-orders" class="btn btn-danger px-4 py-2 fw-bold">
                    XEM ĐƠN HÀNG <i class="fas fa-arrow-right ms-2"></i>
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

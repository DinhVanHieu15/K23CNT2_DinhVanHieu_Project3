<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${dvhTitle} ?: 'DVH Motobike Shop'">DVH Motobike Shop</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="margin:0;background:#f3f4f6;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">

<header style="
        background:#f9fafb;
        padding:10px 24px;
        display:flex;
        align-items:center;
        justify-content:space-between;
        box-shadow:0 2px 8px rgba(15,23,42,0.15);
    ">
    <!-- Menu + Logo -->
    <div style="display:flex;align-items:center;gap:14px;">
        <!-- Icon menu 3 gạch -->
        <div style="width:26px;height:22px;display:flex;flex-direction:column;
                    justify-content:space-between;cursor:pointer;">
            <span style="display:block;height:3px;border-radius:999px;background:#111827;"></span>
            <span style="display:block;height:3px;border-radius:999px;background:#111827;"></span>
            <span style="display:block;height:3px;border-radius:999px;background:#111827;"></span>
        </div>

        <!-- LOGO = ẢNH + TEXT -->
        <a th:href="@{/}" style="display:flex;align-items:center;gap:6px;
                                 text-decoration:none;color:#111827;font-weight:700;">
            <!-- file: src/main/resources/static/img/dvh-logo.png -->
            <img th:src="@{/img/dvh-tải xuống.png}" alt="DVH Logo"
                 style="height:32px;width:auto;border-radius:999px;object-fit:cover;">
            <span>DVH Motobike</span>
        </a>
    </div>

    <!-- Thanh tìm kiếm ở giữa -->
    <form th:action="@{/}" method="get"
          style="flex:1;display:flex;justify-content:center;">
        <div style="
                width:60%;
                max-width:540px;
                display:flex;
                align-items:center;
                background:#0b1120;
                border-radius:999px;
                border:2px solid #1d4ed8;
                padding:4px 14px;
            ">
            <div style="
                    width:30px;height:30px;
                    border-radius:999px;
                    background:#1d4ed8;
                    display:flex;align-items:center;justify-content:center;
                    margin-right:8px;
                    color:#f9fafb;font-size:14px;
                ">
                🔍
            </div>
            <input type="text" name="dvhKeyword" placeholder="tìm kiếm"
                   th:value="${dvhKeyword}"
                   style="flex:1;border:none;outline:none;background:transparent;
                          color:#e5e7eb;font-size:14px;">
        </div>
    </form>

    <!-- Icon giỏ hàng + user bên phải -->
    <div style="display:flex;align-items:center;gap:14px;">
        <a th:href="@{/dvh-motorbikes}"
           style="width:44px;height:44px;border-radius:999px;
                  background:#facc15;display:flex;align-items:center;
                  justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,0.35);
                  text-decoration:none;font-size:20px;">
            🛒
        </a>
        <a th:href="@{/dvh-auth/dvh-login}"
           style="width:44px;height:44px;border-radius:999px;
                  background:#fbbf24;display:flex;align-items:center;
                  justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,0.35);
                  text-decoration:none;font-size:20px;">
            👤
        </a>
    </div>
</header>

<main style="padding:18px 0;">
    <!-- fragment layout -->
    <div th:fragment="layout(content)">
        <div th:replace="${content}"></div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

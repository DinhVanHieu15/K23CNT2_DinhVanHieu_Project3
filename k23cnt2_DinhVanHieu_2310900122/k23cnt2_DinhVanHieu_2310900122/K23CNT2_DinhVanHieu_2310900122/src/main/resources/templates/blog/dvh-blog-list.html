<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="layout/dvh-layout :: layout(~{::section})">
<section>
    <div class="container py-3">
        <h5 style="font-weight:700;margin-bottom:12px;">Blog kinh nghiệm xe máy</h5>
        <div th:each="dvhBlog : ${dvhBlogs}"
             style="background:#f9fafb;border-radius:14px;padding:12px;margin-bottom:10px;">
            <h6 style="font-weight:700;" th:text="${dvhBlog.dvhTitle}">Tiêu đề</h6>
            <div style="font-size:13px;color:#6b7280;" th:text="${dvhBlog.dvhSummary}">Tóm tắt</div>
            <div style="font-size:12px;color:#9ca3af;margin-top:4px;"
                 th:text="${#temporals.format(dvhBlog.dvhCreatedAt,'dd/MM/yyyy HH:mm')}">
                01/01/2025
            </div>
        </div>
    </div>
</section>
</html>

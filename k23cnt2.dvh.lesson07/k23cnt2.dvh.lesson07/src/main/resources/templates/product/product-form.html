<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Product Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body style="background:#eee">
<section class="container bg-white mt-5 p-4 rounded shadow-sm"
         th:object="${product}">
    <div class="card">
        <div class="card-header">
            <h5 th:text="*{id} != null ? 'Edit Product' : 'Create Product'">Product Form</h5>
        </div>
        <div class="card-body">
            <form th:action="@{/products/save}" method="post">
                <input type="hidden" th:if="*{id} != null" th:field="*{id}"/>

                <div class="row mb-3">
                    <label class="col-sm-2 col-form-label">Name</label>
                    <div class="col-sm-10">
                        <input type="text" th:field="*{name}" class="form-control" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <label class="col-sm-2 col-form-label">imageUrl</label>
                    <div class="col-sm-10">
                        <input type="text" th:field="*{imageUrl}" class="form-control">
                    </div>
                </div>

                <div class="row mb-3">
                    <label class="col-sm-2 col-form-label">Quantity</label>
                    <div class="col-sm-10">
                        <input type="number" th:field="*{quantity}" class="form-control" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <label class="col-sm-2 col-form-label">Price</label>
                    <div class="col-sm-10">
                        <input type="number" step="0.01" th:field="*{price}" class="form-control" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <label class="col-sm-2 col-form-label">Content</label>
                    <div class="col-sm-10">
                        <textarea th:field="*{content}" class="form-control"></textarea>
                    </div>
                </div>

                <div class="row mb-3">
                    <label class="col-sm-2 col-form-label">Category</label>
                    <div class="col-sm-10">
                        <!-- bind trực tiếp ManyToOne -->
                        <select th:field="*{category}" class="form-control" required>
                            <option th:each="category : ${categories}"
                                    th:value="${category.id}"
                                    th:text="${category.categoryName}">
                            </option>
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <label class="col-sm-2 col-form-label">Status</label>
                    <div class="col-sm-10">
                        <input type="checkbox" th:field="*{status}">
                    </div>
                </div>

                <div class="card-footer d-flex gap-2">
                    <button type="submit" class="btn btn-success"
                            th:text="*{id} != null ? 'Update' : 'Create'">Save</button>
                    <a th:href="@{/products}" class="btn btn-secondary">Back to List</a>
                </div>
            </form>
        </div>
    </div>
</section>
</body>
</html>

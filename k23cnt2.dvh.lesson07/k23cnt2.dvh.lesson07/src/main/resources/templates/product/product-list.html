<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Product List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">Product List</h2>

    <a th:href="@{/products/create}" class="btn btn-primary mb-3">Add New Product</a>

    <!-- Nếu trống -->
    <div th:if="${products.size() == 0}" class="alert alert-info">
        No products available.
    </div>

    <!-- Bảng danh sách -->
    <table th:if="${products.size() > 0}" class="table table-bordered table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Product Name</th>
            <th>Image</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Category</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product : ${products}">
            <td th:text="${product.id}">1</td>
            <td th:text="${product.name}">Name</td>
            <td><img th:src="${product.imageUrl}" alt="Product Image" width="50"></td>
            <td th:text="${product.price}">0</td>
            <td th:text="${product.quantity}">0</td>
            <td th:text="${product.category != null ? product.category.categoryName : 'N/A'}">Category</td>
            <td th:text="${product.status} ? 'Available' : 'Out of Stock'">Available</td>
            <td class="d-flex gap-2">
                <a th:href="@{'/products/edit/' + ${product.id}}" class="btn btn-warning btn-sm">Edit</a>
                <a th:href="@{'/products/delete/' + ${product.id}}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Are you sure you want to delete this product?')">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <a class="btn btn-secondary mt-3" th:href="@{/}">Back Home</a>
</div>
</body>
</html>

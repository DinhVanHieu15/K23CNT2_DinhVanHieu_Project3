<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Category Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">
<div class="container bg-white p-4 rounded shadow-sm" th:object="${category}">
    <h3 th:text="*{id} != null ? 'Edit Category' : 'Create Category'">Category Form</h3>
    <form th:action="@{/category/save}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="mb-3">
            <label class="form-label">Category Name</label>
            <input class="form-control" type="text" th:field="*{categoryName}" required>
        </div>
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" th:field="*{categoryStatus}" id="status">
            <label class="form-check-label" for="status">Active</label>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">Save</button>
            <a class="btn btn-secondary" th:href="@{/category}">Back to List</a>
        </div>
    </form>
</div>
</body>
</html>
